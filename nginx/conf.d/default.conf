server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # TLS ends at Cloudflare, so nginx sees plain http. Keep redirects
    # relative (Location: /app/) instead of http://host/app/, which would
    # bounce through an extra http->https hop.
    absolute_redirect off;

    # Draw app — SPA fallback for client-side routing (/draw/edit/:id, /draw/s/:id)
    location /draw/ {
        try_files $uri $uri/ /draw/index.html;
    }

    # The generator briefly lived at /app/; keep old links and bookmarks
    # working (query string kept so ?auth_error=... survives)
    location = /app { return 301 /$is_args$args; }
    location = /app/ { return 301 /$is_args$args; }

    # Static multi-page site (/, /about/, /releases/, ...). No SPA fallback:
    # unknown paths must 404 instead of silently serving the generator
    # with a 200.
    location / {
        try_files $uri $uri/ =404;
    }

    # API proxy
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gemini 2.5-flash can take 30-90s for complex prompts
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
