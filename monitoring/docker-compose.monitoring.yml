services:
  prometheus:
    container_name: prometheus
    build:
      context: ./
      dockerfile: prometheus/Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - smi
    # Come back after a Pi reboot / Docker restart, unless stopped by hand
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Secret files must exist before `up` (else Docker creates directories)
      # and be readable by the container user (nobody): chmod 644
      - ./secrets/telegram_bot_token:/etc/alertmanager/secrets/telegram_bot_token:ro
      - ../dispatcher/secrets/dispatcher_token:/etc/alertmanager/secrets/dispatcher_token:ro
      # Silences + notification log. Named so it also survives `compose down`
      # (the image's anonymous volume doesn't): otherwise silences are lost and
      # Telegram gets every still-firing alert again
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - smi
    restart: unless-stopped

networks:
  smi:
    name: smi-network
    external: true


volumes:
  prometheus-data:
  alertmanager-data:
