services:
  prometheus:
    build:
      context: ./
      dockerfile: prometheus/Dockerfile
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - smi

networks:
  smi:
    name: smi-network
    external: true


volumes:
  prometheus-data:
