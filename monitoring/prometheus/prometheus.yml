global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  # Service names on smi-network, not container names (those change with the
  # compose project name)
  - job_name: 'api'
    static_configs:
      - targets: ['api:8000']

  # Separate job: if it shared `api`, a dead dispatcher would fire ApiMetricsDown.
  # This scrape monitors the dispatcher itself; alerts reach it via the
  # Alertmanager webhook, not via Prometheus.
  - job_name: 'dispatcher'
    static_configs:
      - targets: ['dispatcher:8080']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

storage:
  tsdb:
    retention:
      time: 4d
      size: 1GB
