global:
  scrape_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['sketchmyinfra-api-1:8000']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

storage:
  tsdb:
    retention:
      time: 4d
      size: 1GB
