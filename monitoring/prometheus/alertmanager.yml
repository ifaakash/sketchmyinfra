global:
  resolve_timeout: 5m

# The root route on which each incoming alert enters.
route:
  # Group alerts by alertname and instance so you don't get flooded
  group_by: ['alertname', 'instance']
  
  # How long to wait before sending the first notification (allows bundling)
  group_wait: 30s
  
  # How long to wait before sending updates to the same group
  group_interval: 5m
  
  # How long to wait before re-sending a given alert that is still firing
  repeat_interval: 4h
  
  # The default receiver if no child routes match
  receiver: 'telegram-bot-notifications'
  routes:
    - matchers: ['agent="true"']
      receiver: agent-dispatcher
      continue: true
    - receiver: telegram-bot-notifications

receivers:
  - name: 'telegram-bot-notifications'
    telegram_configs:
      # Token lives in monitoring/secrets/ (gitignored), mounted read-only
      - bot_token_file: /etc/alertmanager/secrets/telegram_bot_token
        chat_id: 5925832114
        send_resolved: true

  # Same token file as dispatcher/secrets/dispatcher_token
  - name: agent-dispatcher
    webhook_configs:
      - url: http://dispatcher:8080/alert
        send_resolved: false
        http_config:
          authorization:
            credentials_file: /etc/alertmanager/secrets/dispatcher_token
