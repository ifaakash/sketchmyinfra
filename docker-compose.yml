services:
  nginx:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smi

  api:
    build: ./backend
    env_file: .env
    expose:
      - "8000"
    # Retry migrations: postgres can still be finishing startup when the api starts
    entrypoint: ["/bin/sh", "-c", "for i in 1 2 3 4 5; do alembic upgrade head && break; [ $$i = 5 ] && exit 1; echo \"alembic failed, retry $$i/5 in 3s\"; sleep 3; done && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smi

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sketchmyinfra
      POSTGRES_USER: smi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      # -h 127.0.0.1: the image's temporary init server listens on the unix
      # socket only, so a socket check can pass before the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U smi -d sketchmyinfra"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - smi

  plantuml:
    # Pinned server + vendored icon libraries; security profile set in the Dockerfile
    build:
      context: ./plantuml
      # Bridge-network DNS to GitHub is unreliable on the host; use host networking
      # for the one build step that downloads the icon libraries
      network: host
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - smi

volumes:
  pgdata:

networks:
  smi:
    name: smi-network
    driver: bridge
