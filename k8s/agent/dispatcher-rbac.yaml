# Identity the dispatcher (running on docker-compose, outside the cluster)
# uses to launch agent Jobs. Namespaced Role, not ClusterRole: it can't see
# or touch anything outside `agent`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
  namespace: agent
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
  namespace: agent
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    # list/get: cooldown + concurrency checks; delete: roll back a Job whose
    # incident ConfigMap failed to create
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
  namespace: agent
subjects:
  - kind: ServiceAccount
    name: dispatcher
    namespace: agent
roleRef:
  kind: Role
  name: dispatcher
  apiGroup: rbac.authorization.k8s.io
---
# Long-lived token for the out-of-cluster dispatcher's kubeconfig
# (see dispatcher/scripts/make-kubeconfig.sh). Delete + re-apply to rotate.
apiVersion: v1
kind: Secret
metadata:
  name: dispatcher-token
  namespace: agent
  annotations:
    kubernetes.io/service-account.name: dispatcher
type: kubernetes.io/service-account-token
