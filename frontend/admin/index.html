<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — SketchMyInfra</title>
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body>

  <!-- Key gate. Shown until a key successfully authenticates; the key lives in
       sessionStorage, so a refresh keeps you in but closing the tab logs out. -->
  <div id="keyGate">
    <div class="gate-card">
      <h1>SketchMyInfra Admin</h1>
      <p>Enter the admin API key to continue.</p>
      <input type="password" id="apiKey" placeholder="Admin API key" autocomplete="off" autofocus>
      <button class="btn-primary" id="unlockBtn">Unlock</button>
      <p class="status-msg" id="gateStatus" style="margin: 12px 0 0"></p>
    </div>
  </div>

  <div id="shell">
    <div class="topbar">
     <div class="topbar-inner">
      <h1>SketchMyInfra Admin</h1>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview">Overview</a>
        <a href="#/users" data-route="users">Users</a>
        <a href="#/generations" data-route="generations">Generations</a>
      </nav>
      <div class="topbar-right">
        <span class="status-msg" id="status"></span>
        <button class="btn-ghost" id="refreshBtn">Refresh</button>
        <button class="btn-ghost" id="signOutBtn">Sign out</button>
      </div>
     </div>
    </div>

    <main id="view">
      <div class="loading">Loading…</div>
    </main>
  </div>

  <!-- Generation detail, populated from /api/admin/generations/{id} -->
  <div id="detailModal">
    <div class="modal-card">
      <div class="modal-head">
        <h3>Generation detail</h3>
        <button class="btn-ghost" id="modalCloseBtn">Close</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="admin.js?v=1"></script>
</body>
</html>
